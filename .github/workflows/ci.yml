name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record agent-container version
        run: |
          printf '### agent-container version\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          bin/agentctl --version >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Install lint dependency
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            -r requirements-lint.txt

      - name: Run Ruff lint
        run: bin/lint

      - name: Run Codex tests
        run: python3 -m unittest discover -s tests/codex -v
        env:
          PYTHONPATH: src

      - name: Run container unit tests
        run: python3 -m unittest discover -s tests/container -v
        env:
          PYTHONPATH: src

      - name: Run broker socket integration tests
        run: |
          socket_log=$(mktemp)
          trap 'rm -f "$socket_log"' EXIT
          if python3 -m unittest \
              tests.integration.test_github_broker_socket \
              tests.integration.test_handover_broker_socket \
              tests.integration.test_egress_broker_socket \
              -v 2>"$socket_log"; then
            socket_status=0
          else
            socket_status=$?
          fi
          cat "$socket_log" >&2
          if grep -F "ResourceWarning" "$socket_log"; then
            exit 1
          fi
          test "$socket_status" -eq 0
        env:
          PYTHONPATH: src
          AGENT_CONTAINER_RUN_SOCKET_INTEGRATION: "1"

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  podman-integration:
    name: Podman integration
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_IMAGE: localhost/agent-container:ci
      NODE_VERSION: 26.7.0
      CODEX_VERSION: 0.149.1
      CLAUDE_VERSION: 2.1.243
      PODMAN_STATIC_TAG: v5.8.4
      PODMAN_STATIC_SHA256_AMD64: a58765fe8be6ab3fb79f892f1a027b4ce4a7e8eb589df1ef960c167cbde08d69
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The hosted ubuntu-24.04 image went back to apt Podman 4.9.3 on
      # 2026-09-01 (actions/runner-images#14642). Family intake requires
      # Podman 5.8 with crun, so install the pinned static bundle that the
      # runner image itself shipped until then, following its install recipe.
      - name: Install Podman 5.8 bundle
        run: |
          set -x
          current=$(podman --version | sed -E 's/^podman version ([0-9]+\.[0-9]+).*/\1/')
          if [ "$(printf '%s\n5.8\n' "$current" | sort -V | head -n1)" = "5.8" ]; then
            echo "podman $current already satisfies >= 5.8"
            exit 0
          fi
          test "$(dpkg --print-architecture)" = amd64
          archive=podman-linux-amd64.tar.gz
          curl -fsSLO "https://github.com/mgoltzsche/podman-static/releases/download/${PODMAN_STATIC_TAG}/${archive}"
          echo "${PODMAN_STATIC_SHA256_AMD64}  ${archive}" | sha256sum --check --strict -
          # The bundle stores every entry as uid/gid 1001 and includes the
          # /usr and /etc directory entries themselves; keep system ownership.
          sudo tar -xzf "$archive" -C / --strip-components=1 --no-same-owner --no-overwrite-dir \
            podman-linux-amd64/usr podman-linux-amd64/etc
          rm -f "$archive"
          sudo mkdir -p /etc/containers/containers.conf.d
          # Prefer the bundled crun over the older apt crun that buildah pulls in.
          printf '[engine.runtimes]\ncrun = ["/usr/local/bin/crun"]\n' \
            | sudo tee /etc/containers/containers.conf.d/00-fix-runtime.conf
          # Do not shadow the distro setuid fusermount3 with the bundle's copy.
          sudo rm -f /usr/local/bin/fusermount3
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
          # grant the static binary the same userns permission as the apt package.
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo tee /etc/apparmor.d/podman <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile podman /usr/{bin,local/bin}/podman flags=(unconfined) {
            userns,

            include if exists <local/podman>
          }
          EOF
            sudo apparmor_parser -r -W /etc/apparmor.d/podman
          fi
          # netavark may default to nftables on Ubuntu and then break name resolution.
          printf '[network]\nfirewall_driver = "iptables"\n' \
            | sudo tee /etc/containers/containers.conf.d/99-fix-firewall.conf
          hash -r
          podman --version

      - name: Verify rootless Podman
        run: |
          podman --version
          current=$(podman --version | sed -E 's/^podman version ([0-9]+\.[0-9]+).*/\1/')
          # >= 5.8 is required for the family intake gate.
          test "$(printf '%s\n5.8\n' "$current" | sort -V | head -n1)" = "5.8"
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          test "$(podman info --format '{{.Host.OCIRuntime.Name}}')" = crun

      - name: Record available storage
        run: df -h "$GITHUB_WORKSPACE"

      - name: Build base image
        run: |
          podman build \
            --build-arg "NODE_VERSION=$NODE_VERSION" \
            --build-arg "CODEX_VERSION=$CODEX_VERSION" \
            --build-arg "CLAUDE_VERSION=$CLAUDE_VERSION" \
            --build-arg "AGENT_CONTAINER_VERSION=$(PYTHONPATH=src python3 -c 'import agent_container; print(agent_container.__version__)')" \
            --build-arg AGENT_CLI_CACHEBUST=ci-v1 \
            --tag "$BASE_IMAGE" \
            --file Containerfile \
            .

      - name: Verify base image
        run: |
          podman image inspect --format '{{.Id}}' "$BASE_IMAGE"
          podman run --rm "$BASE_IMAGE" node --version
          podman run --rm "$BASE_IMAGE" codex --version
          podman run --rm "$BASE_IMAGE" codex --approve-for-me --help >/dev/null
          podman run --rm "$BASE_IMAGE" claude --version
          podman run --rm "$BASE_IMAGE" python3 -m pip --version
          test "$(podman run --rm "$BASE_IMAGE" python3 -m ruff --version)" = "ruff 0.16.4"
          podman run --rm "$BASE_IMAGE" rg --version
          expected="$(PYTHONPATH=src python3 -c 'import agent_container; print(agent_container.__version__)')"
          test "$(podman run --rm "$BASE_IMAGE" python3 -m agent_container.agentctl --version)" = "agentctl $expected"

      - name: Run real Podman integration tests
        run: |
          podman_log=$(mktemp)
          trap 'rm -f "$podman_log"' EXIT
          if python3 -m unittest \
              tests.integration.test_project_image_podman \
              tests.integration.test_egress_podman \
              tests.integration.test_family_intake_podman \
              -v 2>"$podman_log"; then
            podman_status=0
          else
            podman_status=$?
          fi
          cat "$podman_log" >&2
          test "$podman_status" -eq 0
          grep -F "Ran 14 tests" "$podman_log"
          if grep -F "skipped" "$podman_log"; then
            exit 1
          fi
        env:
          PYTHONPATH: src
          AGENT_CONTAINER_RUN_PODMAN_INTEGRATION: "1"
          AGENT_CONTAINER_INTEGRATION_BASE_IMAGE: ${{ env.BASE_IMAGE }}
          AGENT_FAMILY_TEST_IMAGE: ${{ env.BASE_IMAGE }}

      - name: Record final storage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          podman system df
