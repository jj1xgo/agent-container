name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install lint dependency
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps \
            -r requirements-lint.txt

      - name: Run Ruff lint
        run: bin/lint

      - name: Run Codex tests
        run: python3 -m unittest discover -s tests/codex -v
        env:
          PYTHONPATH: src

      - name: Run container unit tests
        run: python3 -m unittest discover -s tests/container -v
        env:
          PYTHONPATH: src

      - name: Run broker socket integration tests
        run: |
          socket_log=$(mktemp)
          trap 'rm -f "$socket_log"' EXIT
          if python3 -m unittest \
              tests.integration.test_github_broker_socket \
              tests.integration.test_handover_broker_socket \
              tests.integration.test_egress_broker_socket \
              -v 2>"$socket_log"; then
            socket_status=0
          else
            socket_status=$?
          fi
          cat "$socket_log" >&2
          if grep -F "ResourceWarning" "$socket_log"; then
            exit 1
          fi
          test "$socket_status" -eq 0
        env:
          PYTHONPATH: src
          AGENT_CONTAINER_RUN_SOCKET_INTEGRATION: "1"

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  podman-integration:
    name: Podman integration
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_IMAGE: localhost/agent-container:ci
      NODE_VERSION: 26.7.0
      CODEX_VERSION: 0.149.1
      CLAUDE_VERSION: 2.1.243
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify rootless Podman
        run: |
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

      - name: Record available storage
        run: df -h "$GITHUB_WORKSPACE"

      - name: Build base image
        run: |
          podman build \
            --build-arg "NODE_VERSION=$NODE_VERSION" \
            --build-arg "CODEX_VERSION=$CODEX_VERSION" \
            --build-arg "CLAUDE_VERSION=$CLAUDE_VERSION" \
            --build-arg "AGENT_CONTAINER_VERSION=$(PYTHONPATH=src python3 -c 'import agent_container; print(agent_container.__version__)')" \
            --build-arg AGENT_CLI_CACHEBUST=ci-v1 \
            --tag "$BASE_IMAGE" \
            --file Containerfile \
            .

      - name: Verify base image
        run: |
          podman image inspect --format '{{.Id}}' "$BASE_IMAGE"
          podman run --rm "$BASE_IMAGE" node --version
          podman run --rm "$BASE_IMAGE" codex --version
          podman run --rm "$BASE_IMAGE" codex --approve-for-me --help >/dev/null
          podman run --rm "$BASE_IMAGE" claude --version
          podman run --rm "$BASE_IMAGE" python3 -m pip --version
          test "$(podman run --rm "$BASE_IMAGE" python3 -m ruff --version)" = "ruff 0.16.4"
          podman run --rm "$BASE_IMAGE" rg --version
          expected="$(PYTHONPATH=src python3 -c 'import agent_container; print(agent_container.__version__)')"
          test "$(podman run --rm "$BASE_IMAGE" python3 -m agent_container.agentctl --version)" = "agentctl $expected"

      - name: Run real Podman integration tests
        run: |
          podman_log=$(mktemp)
          trap 'rm -f "$podman_log"' EXIT
          if python3 -m unittest \
              tests.integration.test_project_image_podman \
              tests.integration.test_egress_podman \
              tests.integration.test_family_intake_podman \
              -v 2>"$podman_log"; then
            podman_status=0
          else
            podman_status=$?
          fi
          cat "$podman_log" >&2
          test "$podman_status" -eq 0
          grep -F "Ran 14 tests" "$podman_log"
          if grep -F "skipped" "$podman_log"; then
            exit 1
          fi
        env:
          PYTHONPATH: src
          AGENT_CONTAINER_RUN_PODMAN_INTEGRATION: "1"
          AGENT_CONTAINER_INTEGRATION_BASE_IMAGE: ${{ env.BASE_IMAGE }}
          AGENT_FAMILY_TEST_IMAGE: ${{ env.BASE_IMAGE }}

      - name: Record final storage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          podman system df
